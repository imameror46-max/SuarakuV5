name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip
        run: unzip -q '*.zip'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: SuaraKu
        run: |
          if ! gradle assembleDebug --no-daemon > build.log 2>&1; then
            {
              echo '## ERROR BUILD'
              echo '```'
              grep -A 15 "What went wrong" build.log | head -60
              grep -E "^e: |error:|Unresolved" build.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SuaraKu-debug-apk
          path: SuaraKu/app/build/outputs/apk/debug/*.apk
